<script>
(function () {
  'use strict';

  var M = window.MiniApp;
  var t = M.t;

  // ── state: everything is declared before the first render ────────────────

  // Per service: what the form shows and its size limits when `p` is absent
  // (the same limits the bot clamps to). Prices are never listed here.
  // plan: the Reja sub-view (kurs/diplom plan their chapters in the bot);
  // structure: sections per chapter as well.
  var SERVICES = {
    presentation: { sizeKey: 'slides', unitKey: 'per_slide', icon: 'i-slides',
      n: { min: 10, max: 30, def: 10 }, step: 1, quality: 'premium', plan: true, structure: false, faculty: false,
      perUnit: true },
    referat: { sizeKey: 'pages', unitKey: 'per_page', icon: 'i-page',
      n: { min: 10, max: 30, def: 15 }, step: 1, quality: 'pro', plan: true, structure: true, faculty: true,
      perUnit: true },
    mustaqil: { sizeKey: 'pages', unitKey: 'per_page', icon: 'i-page',
      n: { min: 10, max: 30, def: 15 }, step: 1, quality: 'pro', plan: true, structure: true, faculty: true,
      perUnit: true },
    kurs: { sizeKey: 'pages', unitKey: 'per_page', icon: 'i-page',
      n: { min: 25, max: 50, def: 25 }, step: 5, quality: null, plan: false, structure: false, faculty: true },
    diplom: { sizeKey: 'pages', unitKey: 'per_page', icon: 'i-page',
      n: { min: 25, max: 50, def: 25 }, step: 5, quality: null, plan: false, structure: false, faculty: true }
  };
  var MOVED = { uslubiy: true };
  // Chapter limits and the default count when `p` has none.
  var PLAN_FALLBACK = {
    presentation: { ch: { min: 2, max: 6 }, def: 4 },
    doc: { ch: { min: 2, max: 4 }, sc: { min: 2, max: 4 }, def: 2 }
  };
  var PLAN_LINE_MAX = 150;
  // Numbering and bullets a pasted list brings along.
  var NUMBERING = /^\s*(?:\d{1,3}\s*[.)]|[-•*–])\s*/;
  // The one leading "N." / "N)" the bot itself strips from a plan line
  // (utils/webapp_contract._PLAN_NUMBER), and nothing more.
  var BOT_NUMBERING = /^\s*\d{1,3}\s*[.)]\s*/;
  var TITLE_FIELDS = ['author', 'reviewer', 'university', 'fakultet', 'specialty'];
  var PROFILE_KEY = 'profile';

  var docType = M.params.doc_type === 'report' ? 'mustaqil' : (M.params.doc_type || '');
  var service = Object.prototype.hasOwnProperty.call(SERVICES, docType) ? SERVICES[docType] : null;
  // The table must be the one for this service; anything else is ignored.
  var p = (M.prices && (M.prices.svc == null || M.prices.svc === docType)) ? M.prices : null;
  // What prices are read from. Slides, referat and mustaqil are priced per
  // unit (`p.per`); a `p` without it is the old tier table of a keyboard sent
  // before the per-unit prices, whose numbers (and free pictures) the bot no
  // longer charges, so the page says the bot shows the price instead.
  var priced = p && service && service.perUnit && !(p.per && typeof p.per === 'object') ? null : p;
  var s = M.state;

  var limits = null;
  var form = { n: 0, quality: 'standard', extra: 0, chapters: 2, subchapters: 2 };
  var plan = { mode: 'auto', lines: [] };
  // The plan goes into the payload only when the page knows the order's
  // current plan (the bot sent it in `s`) or the student changed it here:
  // "auto" clears a manual plan in the bot, so a plan the page never saw
  // must not be overwritten by the page's default.
  var planKnown = false;
  var planTouched = false;
  // pm "kept" (or "manual" without titles): the order has a manual plan the
  // bot could not fit into the link. The page keeps it (sends no plan) until the
  // student writes a new one or picks the automatic plan.
  var planKept = false;
  // A deck whose chapter count the bot still derives from its size (no `ch`
  // in `s`): the page shows that count and follows the slider with it until
  // the student picks a count here.
  var chaptersFollowSize = false;
  var planUnit = 'chapters';
  var planInputs = [];
  var tabGroup = null;
  var imagesShown = false;
  var storedProfile = {};
  var touched = {};
  var els = {};

  function byId(id) {
    return document.getElementById(id);
  }

  function range(obj, fallback) {
    var lo = obj ? M.toInt(obj.min, NaN) : NaN;
    var hi = obj ? M.toInt(obj.max, NaN) : NaN;
    if (!isFinite(lo) || !isFinite(hi) || lo > hi) return { min: fallback.min, max: fallback.max };
    return { min: lo, max: hi };
  }

  function value(id) {
    return els[id] ? els[id].value.trim() : '';
  }

  // ── render ────────────────────────────────────────────────────────────────

  function buildSegments(container, name, lo, hi, current, onPick) {
    container.textContent = '';
    for (var i = lo; i <= hi; i++) {
      var id = name + '-' + i;
      var input = M.el('input', { type: 'radio', name: name, id: id, value: String(i), checked: i === current });
      input.addEventListener('change', function (event) {
        onPick(parseInt(event.target.value, 10));
        M.haptic('select');
      });
      container.appendChild(input);
      container.appendChild(M.el('label', { attrs: { for: id }, text: String(i) }));
    }
  }

  // No picture is free any more, so none takes a slot off the cap. An old
  // `p` (a keyboard drawn before the per-unit prices) still says img.free 2
  // for decks, which the bot no longer reserves.
  function maxPaid() {
    var table = p && p.img ? { img: { max: p.img.max, rsv: p.img.rsv, free: 0 } } : p;
    return M.pricing.maxPaidImages(table, form.n);
  }

  /**
   * The bot's own chapter count for a deck of n slides: n // 3 within the
   * chapter limits (handlers/presentation._chapters_for; its floor of 3 never
   * applies, since a deck has at least 10 slides).
   */
  function chaptersForSize(n) {
    return M.clamp(Math.floor(n / 3), limits.ch.min, limits.ch.max);
  }

  function followSize() {
    if (!chaptersFollowSize) return;
    var next = chaptersForSize(form.n);
    if (next === form.chapters) return;
    form.chapters = next;
    var radio = byId('count-' + next);
    if (radio) radio.checked = true;
    renderPlanSummary();
  }

  function perUnitText(quality) {
    var unit = M.pricing.unitPrice(priced, quality);
    return unit == null ? '' : t('settings.' + service.unitKey, { price: M.fmtPrice(unit) });
  }

  function renderSize() {
    els['size-value'].textContent = String(form.n);
    els.size.value = String(form.n);
    els.size.setAttribute('aria-valuetext', String(form.n));
    var pct = (form.n - limits.n.min) / Math.max(1, limits.n.max - limits.n.min) * 100;
    els.size.style.setProperty('--pct', pct + '%');
    els['size-dec'].disabled = form.n <= limits.n.min;
    els['size-inc'].disabled = form.n >= limits.n.max;
    els['size-unit'].textContent = perUnitText(form.quality);
    els['size-unit'].hidden = !els['size-unit'].textContent;
  }

  function renderImages() {
    if (!imagesShown) return;
    var img = p.img;
    var cap = maxPaid();
    form.extra = M.clamp(form.extra, 0, cap);
    els.images.max = String(cap);
    if (document.activeElement !== els.images) els.images.value = String(form.extra);
    els['images-dec'].disabled = form.extra <= 0;
    els['images-inc'].disabled = form.extra >= cap;
    els.images.disabled = cap === 0;

    // Every picture is paid (img.free is 0 by contract; an old `p` said 2).
    els['images-free'].textContent = t('settings.images_foot');

    var limitEl = els['images-limit'];
    var hardMax = Math.max(0, M.toInt(img.max, 0));
    if (cap === 0) {
      limitEl.hidden = false;
      limitEl.textContent = t('settings.images_none');
    } else if (cap < hardMax) {
      limitEl.hidden = false;
      limitEl.textContent = t('settings.images_limit', { n: cap });
    } else {
      limitEl.hidden = true;
    }
  }

  function renderPrice() {
    var q = M.pricing.quote(priced, { quality: form.quality, n: form.n, extra: form.extra });
    els['price-unknown'].hidden = !!q;
    els['price-known'].hidden = !q;
    els['price-images-row'].hidden = !q || q.paid === 0;
    // The free first order is shown only while the bot offers it (p.trial).
    els['trial-banner'].hidden = !(q && q.trial);
    if (!q) {
      els['price-total'].removeAttribute('data-amount');
      M.mainButton(t('save'), save);
      return;
    }
    els['price-base-label'].textContent = q.perUnit != null
      ? t('settings.price_' + service.sizeKey, { n: form.n, unit: M.fmtPrice(q.perUnit) })
      : t('settings.price_base');
    var base = els['price-base'];
    base.textContent = '';
    if (q.trial) {
      base.appendChild(M.el('s', { text: M.fmtPrice(q.base) }));
      base.appendChild(M.el('span', { class: 'free-tag', text: t('free') }));
    } else {
      base.textContent = M.fmtPrice(q.base);
    }
    els['price-images-label'].textContent = t('settings.price_images', { n: q.paid, unit: M.fmtPrice(q.unit) });
    els['price-images'].textContent = M.fmtPrice(q.images);
    // "Free" only for an order the trial really covers; otherwise the
    // amount, whatever it is.
    var payable = q.trial && !q.payable ? t('free') : M.fmtPrice(q.payable);
    els['price-total'].textContent = payable;
    els['price-total'].setAttribute('data-amount', String(q.payable));
    M.mainButton(t('save_price', { price: payable }), save);
  }

  function renderQualityHints() {
    if (!service.quality) return;
    els['q-standard-hint'].textContent = perUnitText('standard') || t('settings.q_standard_hint');
    els['q-premium-hint'].textContent = perUnitText('premium') || t('settings.q_' + service.quality + '_hint');
  }

  function renderTitleSummary() {
    var parts = [value('author'), value('university')].filter(Boolean);
    els['title-page-summary'].textContent = parts.length ? parts.join(' · ') : t('settings.title_page_empty');
  }

  function planTitles() {
    return planInputs.map(function (input) { return input.value.trim(); }).filter(Boolean);
  }

  /** The plan kept in the bot still stands: no new titles, no switch to auto. */
  function keptPlanStands() {
    return planKept && plan.mode === 'manual' && !planTitles().length;
  }

  function renderPlanSummary() {
    if (keptPlanStands()) {
      els['plan-summary'].textContent = t('settings.plan_kept_' + planUnit, { n: form.chapters });
      return;
    }
    var manual = plan.mode === 'manual' && planTitles().length >= limits.ch.min;
    var n = manual ? planTitles().length : form.chapters;
    var key = 'settings.plan_' + (manual ? 'manual_' : 'auto_') + planUnit;
    els['plan-summary'].textContent = t(key, { n: n });
  }

  function render() {
    followSize();
    renderSize();
    renderImages();
    renderPrice();
  }

  // ── sub-views: plan, title page ───────────────────────────────────────────

  var openView = null;

  function openSub(id, heading) {
    els['view-main'].hidden = true;
    els[id].hidden = false;
    openView = id;
    window.scrollTo(0, 0);
    if (id === 'view-plan') planInputs.forEach(grow);
    M.backButton(closeSub);
    M.haptic('light');
    els[heading].focus();
  }

  function closeSub() {
    if (!openView) return;
    var was = openView;
    els[was].hidden = true;
    els['view-main'].hidden = false;
    openView = null;
    M.backButton(null);
    renderTitleSummary();
    renderPlanSummary();
    els[was === 'view-plan' ? 'open-plan' : 'open-title-page'].focus();
  }

  function selectTab(next, focus) {
    plan.mode = next;
    var auto = next === 'auto';
    els['tab-auto'].setAttribute('aria-selected', String(auto));
    els['tab-manual'].setAttribute('aria-selected', String(!auto));
    els['panel-auto'].hidden = !auto;
    els['panel-manual'].hidden = auto;
    tabGroup.sync();
    if (focus) els[auto ? 'tab-auto' : 'tab-manual'].focus();
  }

  /** A tab the student picked (click or arrow keys). */
  function pickTab(next, focus) {
    if (next !== plan.mode) {
      planTouched = true;
      M.setDirty(true);
    }
    selectTab(next, focus);
    M.haptic('select');
  }

  function grow(area) {
    area.style.height = 'auto';
    area.style.height = area.scrollHeight + 'px';
  }

  function markFilled(input) {
    var cell = input.closest('.cell');
    if (cell) cell.classList.toggle('filled', !!input.value.trim());
  }

  function buildPlanFields() {
    var box = els.fields;
    box.textContent = '';
    planInputs = [];
    var labelKey = planUnit === 'sections' ? 'plan.field_section' : 'plan.field_chapter';
    var placeholder = t(planUnit === 'sections' ? 'plan.ph_section' : 'plan.ph_chapter');
    for (var i = 0; i < limits.ch.max; i++) {
      var id = 'line-' + (i + 1);
      // A one-line textarea that grows, so a long chapter title stays visible.
      var input = M.el('textarea', {
        id: id, maxLength: PLAN_LINE_MAX, value: plan.lines[i] || '', rows: 1,
        attrs: { autocomplete: 'off', placeholder: placeholder, enterkeyhint: i + 1 < limits.ch.max ? 'next' : 'done' }
      });
      input.addEventListener('paste', onPaste);
      input.addEventListener('keydown', onEnter);
      input.addEventListener('input', function (event) { markFilled(event.target); grow(event.target); });
      box.appendChild(M.el('div', { class: 'cell cell-field' }, [
        M.el('span', { class: 'num', text: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
        M.el('div', { class: 'cell-text' }, [
          M.el('label', { attrs: { for: id }, text: t(labelKey, { n: i + 1 }) }),
          input
        ])
      ]));
      planInputs.push(input);
      markFilled(input);
    }
  }

  function onPaste(event) {
    var data = event.clipboardData && event.clipboardData.getData('text');
    if (!data || !/[\r\n]/.test(data)) return;
    var lines = data.split(/\r?\n|\r/).map(function (line) {
      return line.replace(NUMBERING, '').trim();
    }).filter(Boolean);
    if (lines.length < 2) return;
    event.preventDefault();
    var start = planInputs.indexOf(event.target);
    var room = planInputs.length - start;
    lines.slice(0, room).forEach(function (line, k) {
      planInputs[start + k].value = line.slice(0, PLAN_LINE_MAX);
      markFilled(planInputs[start + k]);
      grow(planInputs[start + k]);
    });
    var used = Math.min(lines.length, room);
    var extra = lines.length - used;
    els['cut-note'].hidden = extra <= 0;
    if (extra > 0) {
      els['cut-note'].textContent = t('plan.cut', { max: used, n: extra });
      M.haptic('warning');
    }
    planTouched = true;
    M.setDirty(true);
  }

  function onEnter(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    var next = planInputs[planInputs.indexOf(event.target) + 1];
    if (next) next.focus();
    else event.target.blur();
  }

  // ── send ──────────────────────────────────────────────────────────────────

  function rememberProfile() {
    var profile = {};
    Object.keys(storedProfile).forEach(function (key) { profile[key] = storedProfile[key]; });
    TITLE_FIELDS.forEach(function (key) {
      if (value(key)) profile[key] = value(key);
    });
    M.store.set(PROFILE_KEY, JSON.stringify(profile));
  }

  function save() {
    var topic = value('topic');
    if (!topic) {
      closeSub();
      M.haptic('error');
      M.showAlert(t('settings.err_topic'));
      els.topic.focus();
      return;
    }
    var sendPlan = service.plan && (planKnown || planTouched) && !keptPlanStands();
    var titles = planTitles();
    var manual = sendPlan && plan.mode === 'manual';
    if (manual && titles.length < limits.ch.min) {
      if (openView !== 'view-plan') openSub('view-plan', 'plan-heading');
      M.haptic('error');
      M.showAlert(t(planUnit === 'sections' ? 'plan.err_min_sections' : 'plan.err_min_chapters', { min: limits.ch.min }));
      return;
    }
    // Field names are the bot's contract (utils/webapp_contract.py). An empty
    // string means "not provided", so nothing set earlier is wiped. No price.
    var payload = {
      action: 'full_settings',
      v: M.PAYLOAD_VERSION,
      doc_type: docType,
      topic: topic,
      subject: value('subject'),
      author: value('author'),
      language: els.language.value,
      quality: form.quality === 'premium' ? 'pro' : 'standard',
      num_pages: form.n,
      university: value('university'),
      reviewer: value('reviewer')
    };
    if (imagesShown) payload.ai_images_extra = form.extra;
    if (service.faculty) {
      payload.fakultet = value('fakultet');
      payload.specialty = value('specialty');
    }
    if (sendPlan) {
      // The plan, as plan.html's plan_update sends it: manual titles are
      // "1. A\n2. B" and their count is the chapter count.
      payload.plan_mode = manual ? 'manual' : 'auto';
      payload.num_chapters = manual ? titles.length : form.chapters;
      if (manual) payload.manual_plan = titles.map(function (title, i) { return (i + 1) + '. ' + title; }).join('\n');
    } else if (service.structure) {
      // Documents always sent their chapter count (the bot's own value, from `s`).
      payload.num_chapters = form.chapters;
    }
    if (service.structure) payload.num_subchapters = form.subchapters;
    rememberProfile();
    M.sendPayload(payload);
  }

  // ── prefill ───────────────────────────────────────────────────────────────

  function text(v) {
    return typeof v === 'string' ? v : '';
  }

  function prefill() {
    els.topic.value = text(s.topic);
    els.subject.value = text(s.subject);
    els.university.value = text(s.university);
    els.fakultet.value = text(s.fakultet);
    els.specialty.value = text(s.specialty);
    els.language.value = ['uz', 'ru', 'en'].indexOf(s.language) >= 0 ? s.language : 'uz';

    M.store.get(PROFILE_KEY).then(function (raw) {
      try {
        var saved = JSON.parse(raw || '{}');
        if (saved && typeof saved === 'object') storedProfile = saved;
      } catch (e) { storedProfile = {}; }
      TITLE_FIELDS.forEach(function (key) {
        if (!touched[key] && !els[key].value && typeof storedProfile[key] === 'string') {
          els[key].value = storedProfile[key].slice(0, els[key].maxLength > 0 ? els[key].maxLength : 200);
        }
      });
      var user = M.user;
      if (!touched.author && !els.author.value && user) {
        els.author.value = [text(user.first_name), text(user.last_name)].join(' ').trim().slice(0, 120);
      }
      renderTitleSummary();
    });
  }

  // ── wiring ────────────────────────────────────────────────────────────────

  function stepSize(delta) {
    form.n = M.clamp(form.n + delta * service.step, limits.n.min, limits.n.max);
    M.haptic('select');
    M.setDirty(true);
    render();
  }

  function wire() {
    els.topic.addEventListener('input', function () { grow(els.topic); });
    els.size.addEventListener('input', function () {
      form.n = M.clamp(M.toInt(els.size.value, limits.n.min), limits.n.min, limits.n.max);
      render();
    });
    els.size.addEventListener('change', function () { M.haptic('select'); });
    els['size-dec'].addEventListener('click', function () { stepSize(-1); });
    els['size-inc'].addEventListener('click', function () { stepSize(1); });

    Array.prototype.forEach.call(document.querySelectorAll('input[name="quality"]'), function (input) {
      input.addEventListener('change', function () {
        form.quality = input.value;
        M.haptic('select');
        render();
      });
    });

    els.images.addEventListener('input', function () {
      var v = M.toInt(els.images.value, NaN);
      if (isFinite(v)) {
        form.extra = M.clamp(v, 0, maxPaid());
        render();
      }
    });
    els.images.addEventListener('change', function () {
      els.images.value = String(form.extra);
    });
    els['images-dec'].addEventListener('click', function () {
      form.extra = Math.max(0, form.extra - 1);
      M.haptic('select');
      M.setDirty(true);
      render();
    });
    els['images-inc'].addEventListener('click', function () {
      form.extra = Math.min(maxPaid(), form.extra + 1);
      M.haptic('select');
      M.setDirty(true);
      render();
    });

    els['open-title-page'].addEventListener('click', function () { openSub('view-title', 'title-page-heading'); });
    els['open-plan'].addEventListener('click', function () { openSub('view-plan', 'plan-heading'); });

    tabGroup = M.rovingGroup(els.tabs, '[role="tab"]', function (tab) {
      pickTab(tab.id === 'tab-manual' ? 'manual' : 'auto', false);
    });
    els['tab-auto'].addEventListener('click', function () { pickTab('auto', true); });
    els['tab-manual'].addEventListener('click', function () { pickTab('manual', true); });

    TITLE_FIELDS.forEach(function (key) {
      els[key].addEventListener('input', function () { touched[key] = true; });
    });

    // An edit of the count or the titles is a plan choice (tabs: pickTab);
    // sections per chapter are sent on their own and are not.
    function planEdited(event) {
      if (event.target.closest && event.target.closest('#panel-auto, #panel-manual')) planTouched = true;
    }
    els['view-plan'].addEventListener('input', planEdited);
    els['view-plan'].addEventListener('change', planEdited);

    var app = byId('app');
    app.addEventListener('input', function (event) {
      M.setDirty(true);
      if (event.target.closest && event.target.closest('#fields')) els['cut-note'].hidden = true;
    });
    app.addEventListener('change', function () { M.setDirty(true); });
  }

  function init() {
    Array.prototype.forEach.call(document.querySelectorAll('[id]'), function (node) {
      els[node.id] = node;
    });
    M.applyI18n();

    if (MOVED[docType]) {
      document.title = t('settings.moved_title');
      M.showNotice(t('settings.moved_title'), t('settings.moved_text'));
      M.ready();
      return;
    }
    if (!service) {
      document.title = t('bad_link_title');
      M.showNotice(t('bad_link_title'), t('bad_link'));
      M.ready();
      return;
    }

    var title = t('settings.title_' + docType);
    document.title = title;
    els['page-title'].textContent = title;

    var isPresentation = docType === 'presentation';
    var planFallback = isPresentation ? PLAN_FALLBACK.presentation : PLAN_FALLBACK.doc;
    planUnit = isPresentation ? 'sections' : 'chapters';
    limits = {
      n: range(p && p.n, service.n),
      ch: range(p && p.ch, planFallback.ch),
      sc: range(p && p.sc, PLAN_FALLBACK.doc.sc)
    };
    var def = p && p.n ? M.toInt(p.n.def, service.n.def) : service.n.def;
    form.n = M.clamp(M.toInt(s.n != null ? s.n : s.slides, def), limits.n.min, limits.n.max);
    form.quality = M.pricing.qualityKey(M.params.quality);
    form.extra = Math.max(0, M.toInt(s.img, 0));
    var chDef = M.toInt(p && p.ch && p.ch.def, planFallback.def);
    form.chapters = M.clamp(M.toInt(s.ch, chDef), limits.ch.min, limits.ch.max);
    form.subchapters = M.clamp(M.toInt(s.sc, limits.sc.min), limits.sc.min, limits.sc.max);
    imagesShown = !!(p && p.img && M.toInt(p.img.max, 0) > 0);

    // Size: stepper + slider.
    els['size-label'].textContent = t('settings.' + service.sizeKey);
    els['size-icon'].setAttribute('href', '#' + service.icon);
    els.size.min = String(limits.n.min);
    els.size.max = String(limits.n.max);
    els.size.step = String(service.step);
    els['size-min'].textContent = String(limits.n.min);
    els['size-max'].textContent = String(limits.n.max);

    // Quality: presentations say Premium, documents Pro; kurs/diplom have one.
    els['quality-field'].hidden = !service.quality;
    if (service.quality) els['q-premium-name'].textContent = t('settings.q_' + service.quality);
    byId(form.quality === 'premium' ? 'q-premium' : 'q-standard').checked = true;
    renderQualityHints();

    // Trial banner wording.
    els['trial-text'].textContent = t(isPresentation ? 'settings.trial_text_slides' : 'settings.trial_text_pages');

    // Pictures.
    els['images-section'].hidden = !imagesShown;
    if (imagesShown) {
      els['images-label'].textContent = t('settings.images_count');
      els['images-unit'].textContent = t('settings.images_each', { price: M.fmtPrice(M.toInt(p.img.unit, 0)) });
    }

    // Plan sub-view.
    els['plan-heading'].textContent = t(isPresentation ? 'plan.title_presentation' : 'plan.title_doc');
    els['plan-sub'].textContent = t(isPresentation ? 'settings.plan_sub_presentation' : 'settings.plan_sub_doc');
    els['count-label'].textContent = t(isPresentation ? 'plan.count_sections' : 'plan.count_chapters');
    els['limit-note'].textContent = t(isPresentation ? 'plan.limit_sections' : 'plan.limit_chapters',
      { min: limits.ch.min, max: limits.ch.max });
    // The order's plan from `s`: plan = titles, pm = 'auto' | 'manual' |
    // 'kept' (a manual plan whose titles did not fit into the link).
    // Titles or auto/manual mean the page knows the current plan and may
    // send it back.
    // The bot sends clean titles (one leading "N." already stripped), so a
    // list is taken as is: a title may itself start with a number
    // ("1.1 Kirish", "19. asr adabiyoti"). The text form "1. A\n2. B" is
    // plan_update's own format and loses exactly its numbering.
    var given = Array.isArray(s.plan) ? s.plan
      : (typeof s.plan === 'string' ? s.plan.split('\n').map(function (line) {
        return line.replace(BOT_NUMBERING, '');
      }) : []);
    plan.lines = given.map(function (line) {
      return typeof line === 'string' ? line.trim().slice(0, PLAN_LINE_MAX) : '';
    }).filter(Boolean).slice(0, limits.ch.max);
    plan.mode = plan.lines.length && s.pm !== 'auto' ? 'manual' : 'auto';
    planKept = service.plan && (s.pm === 'kept' || s.pm === 'manual') && !plan.lines.length;
    if (planKept) plan.mode = 'manual';
    planKnown = service.plan && !planKept && (plan.lines.length > 0 || s.pm === 'auto' || s.pm === 'manual');
    els['kept-note'].hidden = !planKept;
    chaptersFollowSize = isPresentation && s.ch == null && !planKnown && !planKept;
    if (chaptersFollowSize) form.chapters = chaptersForSize(form.n);

    buildSegments(els.count, 'count', limits.ch.min, limits.ch.max, form.chapters,
      function (v) { form.chapters = v; chaptersFollowSize = false; });
    els['subchapters-field'].hidden = !service.structure;
    if (service.structure) {
      buildSegments(els.subchapters, 'subchapters', limits.sc.min, limits.sc.max, form.subchapters,
        function (v) { form.subchapters = v; });
    }
    buildPlanFields();
    els['open-plan'].hidden = !service.plan;
    els['structure-foot'].textContent = t(service.plan ? 'settings.structure_foot' : 'settings.structure_foot_title');

    els['fakultet-field'].hidden = !service.faculty;
    els['specialty-field'].hidden = !service.faculty;

    prefill();
    wire();
    selectTab(plan.mode);
    render();
    renderTitleSummary();
    renderPlanSummary();
    M.ready({ form: true });
    grow(els.topic);
  }

  if (M.start()) init();
})();
</script>
</body>
</html>
