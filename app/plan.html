<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- Page-level config read by assets/app.js: the bot this page belongs to. -->
  <meta name="miniapp:bot" content="@SLIDEMASTERAI1_BOT">
  <meta name="color-scheme" content="light dark">
  <title>Reja</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="assets/app.css?v=0d5b0e4ef7">
  <script src="assets/i18n.js?v=2b6bd1731b"></script>
  <script src="assets/app.js?v=994b7ee500"></script>
</head>
<body>
<!-- Inline icon sprite: decorative only, every row has a text label. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9.5 6H20M9.5 12H20M9.5 18H20M4.5 6h.5M4.5 12h.5M4.5 18h.5"/></symbol>
</svg>

<!-- The plan page of older keyboards; new ones edit the plan inside
     settings.html (Reja sub-view). Same look, same plan_update payload. -->
<main id="app" class="page" hidden>
  <header class="page-head">
    <h1 id="page-title"></h1>
    <p class="page-sub" data-i18n="plan.subtitle"></p>
  </header>

  <div class="tabs" role="tablist" id="tabs" data-i18n-aria-label="plan.tabs">
    <button type="button" class="tab" role="tab" id="tab-auto" aria-controls="panel-auto" aria-selected="true" data-i18n="plan.tab_auto"></button>
    <button type="button" class="tab" role="tab" id="tab-manual" aria-controls="panel-manual" aria-selected="false" data-i18n="plan.tab_manual"></button>
  </div>

  <section class="group" role="tabpanel" id="panel-auto" aria-labelledby="tab-auto">
    <div class="list icons">
      <div class="cell cell-stack">
        <div class="cell-row">
          <span class="ic ic-teal" aria-hidden="true"><svg class="i"><use href="#i-list"/></svg></span>
          <span class="cell-label" id="count-label"></span>
        </div>
        <div class="segmented" id="count" role="radiogroup" aria-labelledby="count-label"></div>
      </div>
    </div>
    <p class="group-foot" data-i18n="plan.auto_hint"></p>
  </section>

  <section class="group" role="tabpanel" id="panel-manual" aria-labelledby="tab-manual" hidden>
    <p class="hint lead" id="limit-note"></p>
    <div class="list numbered" id="fields"></div>
    <p class="group-foot warn" id="cut-note" role="status" aria-live="polite" hidden></p>
    <p class="group-foot" data-i18n="plan.manual_hint"></p>
  </section>
</main>

<script>
(function () {
  'use strict';

  var M = window.MiniApp;
  var t = M.t;

  // ── state: everything is declared before the first render ────────────────

  // The bot sends p = {ch: {min, max, cur}}: up to 6 sections for a
  // presentation, up to 4 chapters for a referat or mustaqil ish. Without it
  // the same limits apply by page type.
  var FALLBACK = { presentation: { min: 2, max: 6, cur: 4 }, doc: { min: 2, max: 4, cur: 2 } };
  var PLAN_LINE_MAX = 150;
  var NUMBERING = /^\s*(?:\d{1,3}\s*[.)]|[-•*–])\s*/;

  var isPresentation = M.params.doc_type === 'presentation';
  var unit = isPresentation ? 'sections' : 'chapters';
  var ch = null;
  var mode = 'auto';
  var count = 2;
  var inputs = [];
  var els = {};
  var tabGroup = null;

  function byId(id) {
    return document.getElementById(id);
  }

  function limits() {
    var fallback = isPresentation ? FALLBACK.presentation : FALLBACK.doc;
    var given = M.prices && M.prices.ch;
    var lo = given ? M.toInt(given.min, NaN) : NaN;
    var hi = given ? M.toInt(given.max, NaN) : NaN;
    if (!isFinite(lo) || !isFinite(hi) || lo < 1 || lo > hi) {
      lo = fallback.min;
      hi = fallback.max;
    }
    var cur = M.clamp(M.toInt(given && given.cur, fallback.cur), lo, hi);
    return { min: lo, max: hi, cur: cur };
  }

  // ── render ────────────────────────────────────────────────────────────────

  function buildCount() {
    var box = els.count;
    box.textContent = '';
    for (var i = ch.min; i <= ch.max; i++) {
      var id = 'count-' + i;
      var input = M.el('input', { type: 'radio', name: 'count', id: id, value: String(i), checked: i === count });
      input.addEventListener('change', function (event) {
        count = parseInt(event.target.value, 10);
        M.haptic('select');
      });
      box.appendChild(input);
      box.appendChild(M.el('label', { attrs: { for: id }, text: String(i) }));
    }
  }

  function buildFields() {
    var box = els.fields;
    box.textContent = '';
    inputs = [];
    var labelKey = unit === 'sections' ? 'plan.field_section' : 'plan.field_chapter';
    var placeholder = t(unit === 'sections' ? 'plan.ph_section' : 'plan.ph_chapter');
    for (var i = 0; i < ch.max; i++) {
      var id = 'line-' + (i + 1);
      // A one-line textarea that grows, so a long title stays visible.
      var input = M.el('textarea', {
        id: id, maxLength: PLAN_LINE_MAX, rows: 1,
        attrs: { autocomplete: 'off', placeholder: placeholder, enterkeyhint: i + 1 < ch.max ? 'next' : 'done' }
      });
      input.addEventListener('paste', onPaste);
      input.addEventListener('keydown', onEnter);
      input.addEventListener('input', function (event) { markFilled(event.target); grow(event.target); });
      box.appendChild(M.el('div', { class: 'cell cell-field' }, [
        M.el('span', { class: 'num', text: String(i + 1), attrs: { 'aria-hidden': 'true' } }),
        M.el('div', { class: 'cell-text' }, [
          M.el('label', { attrs: { for: id }, text: t(labelKey, { n: i + 1 }) }),
          input
        ])
      ]));
      inputs.push(input);
    }
  }

  function grow(area) {
    area.style.height = 'auto';
    area.style.height = area.scrollHeight + 'px';
  }

  /** A filled line's number gets a ring, so the student sees what counts. */
  function markFilled(input) {
    var cell = input.closest('.cell');
    if (cell) cell.classList.toggle('filled', !!input.value.trim());
  }

  function selectTab(next, focus) {
    mode = next;
    var auto = mode === 'auto';
    els['tab-auto'].setAttribute('aria-selected', String(auto));
    els['tab-manual'].setAttribute('aria-selected', String(!auto));
    els['panel-auto'].hidden = !auto;
    els['panel-manual'].hidden = auto;
    tabGroup.sync();
    if (!auto) inputs.forEach(grow);
    if (focus) els[auto ? 'tab-auto' : 'tab-manual'].focus();
  }

  // ── pasting a whole plan ──────────────────────────────────────────────────

  function onPaste(event) {
    var data = event.clipboardData && event.clipboardData.getData('text');
    if (!data || !/[\r\n]/.test(data)) return;
    var lines = data.split(/\r?\n|\r/).map(function (line) {
      return line.replace(NUMBERING, '').trim();
    }).filter(Boolean);
    if (lines.length < 2) return;
    event.preventDefault();
    var start = inputs.indexOf(event.target);
    var room = inputs.length - start;
    lines.slice(0, room).forEach(function (line, k) {
      inputs[start + k].value = line.slice(0, PLAN_LINE_MAX);
      markFilled(inputs[start + k]);
      grow(inputs[start + k]);
    });
    // More lines than the fields below the pasted one hold: say so here,
    // instead of the bot dropping them silently later. {max} is how many were
    // used, which is less than ch.max when the paste starts on a later line.
    var used = Math.min(lines.length, room);
    var extra = lines.length - used;
    els['cut-note'].hidden = extra <= 0;
    if (extra > 0) {
      els['cut-note'].textContent = t('plan.cut', { max: used, n: extra });
      M.haptic('warning');
    }
    M.setDirty(true);
  }

  function onEnter(event) {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    var next = inputs[inputs.indexOf(event.target) + 1];
    if (next) next.focus();
    else event.target.blur();
  }

  // ── send ──────────────────────────────────────────────────────────────────

  function save() {
    var payload;
    if (mode === 'auto') {
      payload = { action: 'plan_update', v: M.PAYLOAD_VERSION, mode: 'auto', num_chapters: count };
    } else {
      var titles = inputs.map(function (input) { return input.value.trim(); }).filter(Boolean);
      if (titles.length < ch.min) {
        M.haptic('error');
        M.showAlert(t(unit === 'sections' ? 'plan.err_min_sections' : 'plan.err_min_chapters', { min: ch.min }));
        var empty = inputs.filter(function (input) { return !input.value.trim(); })[0];
        if (empty) empty.focus();
        return;
      }
      payload = {
        action: 'plan_update',
        v: M.PAYLOAD_VERSION,
        mode: 'manual',
        num_chapters: titles.length,
        manual_plan: titles.map(function (title, i) { return (i + 1) + '. ' + title; }).join('\n')
      };
    }
    M.sendPayload(payload);
  }

  // ── init ──────────────────────────────────────────────────────────────────

  function init() {
    Array.prototype.forEach.call(document.querySelectorAll('[id]'), function (node) {
      els[node.id] = node;
    });
    M.applyI18n();

    ch = limits();
    count = ch.cur;
    var title = t(isPresentation ? 'plan.title_presentation' : 'plan.title_doc');
    document.title = title;
    els['page-title'].textContent = title;
    els['count-label'].textContent = t(unit === 'sections' ? 'plan.count_sections' : 'plan.count_chapters');
    els['limit-note'].textContent = t(unit === 'sections' ? 'plan.limit_sections' : 'plan.limit_chapters',
      { min: ch.min, max: ch.max });

    buildCount();
    buildFields();

    tabGroup = M.rovingGroup(els.tabs, '[role="tab"]', function (tab) {
      selectTab(tab.id === 'tab-manual' ? 'manual' : 'auto', false);
    });
    els['tab-auto'].addEventListener('click', function () { selectTab('auto'); M.haptic('select'); });
    els['tab-manual'].addEventListener('click', function () { selectTab('manual'); M.haptic('select'); });
    selectTab('auto');

    var app = byId('app');
    app.addEventListener('input', function (event) {
      M.setDirty(true);
      // The "lines ignored" note was about the last paste; typing moves on.
      if (event.target.closest && event.target.closest('#fields')) els['cut-note'].hidden = true;
    });
    app.addEventListener('change', function () { M.setDirty(true); });

    M.mainButton(t('plan.save'), save);
    M.ready({ form: true });
  }

  if (M.start()) init();
})();
</script>
</body>
</html>
